baseURL: "https://your-username.github.io/wuulong-notes-blog/"
languageCode: "zh-tw"
hasCJKLanguage: true
title: "哈爸筆記"
theme: ["PaperMod", "hugo-book"]

outputs:
    home:
        - HTML
        - RSS
        - JSON

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false



minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  BookSection: kb
  githubRepo: "https://github.com/wuulong/wuulong-notes-blog"
  githubBranch: "main"
  cover:
    responsiveImages: false
    hidden: false
    hiddenInSingle: false
    hiddenInList: false
  title: "台灣河川探索誌"
  description: "紀錄大甲溪與台灣各大河川的深度探訪之旅"
  keywords: [Blog, Portfolio, PaperMod, Taiwan, River]
  author: "Wuulong"
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: true
  disableSpecial1stPost: false
  googleSiteVerification: "5e0a771dcada7b8f"
  comments: true

  # Social Icons (Replace URLs with your actual links)
  socialIcons:
    - name: github
      url: "https://github.com/wuulong"
    - name: discord
      url: "https://discord.gg/bywmcqCAEs"
    - name: rss
      url: "https://wuulong.github.io/wuulong-notes-blog/index.xml"

taxonomies:
    category: categories
    tag: tags
    series: series
    basin: basins
    location: locations
    destination: destinations

menu:
  main:
    - identifier: search
      name: Search
      url: /search/
      weight: 5
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: basins
      name: Basins
      url: /basins/
      weight: 12
    - identifier: locations
      name: Locations
      url: /locations/
      weight: 13
    - identifier: destinations
      name: Destinations
      url: /destinations/
      weight: 14
    - identifier: series
      name: Series
      url: /series/
      weight: 15
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: discord
      name: Discord
      url: "https://discord.gg/bywmcqCAEs"
      weight: 40
    - identifier: planning
      name: Planning
      url: /planning/
      weight: 20
    - identifier: kb
      name: kb
      url: /kb/
      weight: 35
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true

related:
  threshold: 80
  toLower: false
  includeNewer: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80
    - name: date
      weight: 10


